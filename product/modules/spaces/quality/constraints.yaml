constraints:
  - id: QC-001
    name: Memory content stays on the owner's machine
    applies_to:
      - CAP-001
      - CAP-002
      - CAP-004
    measure: Network destinations contacted by any Kernle process, and the content sent to each.
    target: >-
      Memory content (events, episodes, cards) is sent only to the configured
      Dreamer endpoint, and only within consolidation SEQ-031. The embedding
      model download in SEQ-001 carries no owner data. Kernle sends no
      telemetry, analytics, or crash reports.
  - id: QC-002
    name: Owner-only access to Kernle data
    applies_to:
      - CAP-001
      - CAP-006
      - CAP-007
    measure: File modes under ~/.kernle and the socket peer check.
    target: >-
      Directories are mode 0700 and files 0600. The daemon socket is mode 0600
      and refuses peers whose uid differs from the home's owner (SEQ-003).
