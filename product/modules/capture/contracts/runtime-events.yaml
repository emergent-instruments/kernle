# How each connected runtime reaches Kernle. Behavior for each mapped event
# is owned by capture SEQ-010 and the recall operation it calls.

runtimes:
  claude-code:
    adapter: ARCH-005 Claude Code plugin running `kernle hook <event>`
    hooks:
      SessionStart: session_index     # recall SEQ-050
      UserPromptSubmit: cue           # recall SEQ-051
      PreToolUse: tool_guard          # Kernle-home write guard, then recall SEQ-052
      Stop: ingest                    # declared async: true
      PreCompact: ingest
      SessionEnd: ingest              # 1.5 s shared runtime budget, so enqueue only
    session_records: ~/.claude/projects/*/*.jsonl
    record_payload_fields: [session_id, cwd, transcript_path, prompt, tool_name, tool_input]
    tools: MCP server `kernle mcp` over stdio (recall contracts/mcp-tools.yaml)
    history_import: supported

  codex:
    adapter: MCP server entry `kernle mcp` in Codex configuration
    hooks: none
    session_records: ~/.codex/sessions/**/*.jsonl
    ingestion_trigger: daemon watcher, after a session file is unchanged for codex_idle_ingest_minutes
    tools: MCP server `kernle mcp` over stdio
    automatic_recall: none; the agent recalls through MCP tools only
    history_import: supported

  openclaw:
    adapter: ARCH-006 OpenClaw plugin (ordinary plugin, not the memory slot)
    hooks:
      before_prompt_build: session_index on the first turn of a session, then cue on every turn
      before_tool_call: tool_guard
      agent_end: ingest the completed turn record forwarded by the plugin
      session_end: ingest flush
    session_records: forwarded turn records; spooled to ~/.kernle/spool/openclaw.jsonl while the daemon is unreachable
    tools: plugin-registered tools with the same contract as recall contracts/mcp-tools.yaml
    history_import: not supported
