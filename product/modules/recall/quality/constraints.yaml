constraints:
  - id: QC-003
    name: Hook latency
    applies_to:
      - CAP-005
      - SEQ-050
      - SEQ-051
      - SEQ-052
    measure: Wall time of `kernle hook` from process start to output, with the daemon running and a space of 5,000 cards.
    target: >-
      p95 at most 50 ms for session start, prompt submit, and pre-tool
      events. No call exceeds hook_deadline_ms (capture SEQ-010 returns empty
      at the deadline).
  - id: QC-004
    name: Context budget
    applies_to:
      - CAP-005
      - SEQ-050
      - SEQ-051
      - SEQ-052
    measure: Tokens Kernle adds to the agent's context per session and per turn.
    target: >-
      Session index at most tier0_budget_tokens (1,500). Cue excerpts at most
      cue_budget_tokens (800) per prompt. At most gut_check_max_warnings (2)
      guardrails per tool call. Nothing is added when nothing qualifies.
