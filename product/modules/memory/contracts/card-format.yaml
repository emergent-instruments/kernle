# Card file format (DATA-011). It is a superset of Claude Code's native memory
# file format, so native readers see name, description, and metadata.type.
# Skills use the Agent Skills SKILL.md format with the same kernle block.

file:
  encoding: UTF-8
  mode: '0600'
  layout: YAML frontmatter between --- lines, then a markdown body

paths:
  card: spaces/<space>/cards/<kind>/<name>.md
  skill: spaces/<space>/skills/<name>/SKILL.md
  projected_skill: ~/.claude/skills/kernle-<name>/SKILL.md plus .kernle-generated

frontmatter:
  name: { type: string, owner_editable: true, rule: "slug, unique within the space" }
  description: { type: string, owner_editable: true, rule: "one line, at most 200 characters" }
  metadata.type:
    type: string
    owner_editable: false
    mapping:
      preference: feedback
      lesson: feedback
      guardrail: feedback
      fact: project
      open-loop: project
  kernle.id: { type: string, owner_editable: false }
  kernle.kind: { type: string, owner_editable: false }
  kernle.status: { type: string, owner_editable: false }
  kernle.pinned: { type: boolean, owner_editable: true, default: false }
  kernle.triggers:
    type: map
    owner_editable: true
    applies_to: guardrail
    keys:
      tools: list of tool names
      patterns: list of case-insensitive substrings or /regex/ matched against the tool input
      paths: list of glob patterns matched against file paths in the tool input
  kernle.appraisal: { type: map, owner_editable: false, keys: [label, valence, arousal, salience] }
  kernle.trust: { type: string, owner_editable: false }
  kernle.confidence: { type: number, owner_editable: false }
  kernle.valid_from: { type: string, owner_editable: false }
  kernle.sources: { type: list, owner_editable: false, item: '<type>:<space>/<id>' }

body:
  min_chars: 1
  max_chars: 2000
  convention: >-
    Lessons and guardrails state the rule first, then a "Why:" line citing the
    episode, then "Applies when:".

example: |
  ---
  name: run-migrations-before-api-deploy
  description: Deploying api/ without make migrate caused a 20-minute outage; always migrate first
  metadata:
    type: feedback
  kernle:
    id: 01JB7Q3W6K2Q8M4V7R1T9XN5CD
    kind: guardrail
    status: active
    pinned: false
    triggers:
      tools: [Bash]
      patterns: ["railway up", "fly deploy", "make deploy"]
      paths: ["api/**"]
    appraisal: { label: alarm, valence: -0.8, arousal: 0.9, salience: 0.92 }
    trust: first_party
    confidence: 0.85
    valid_from: 2026-09-12T18:04:00Z
    sources: ["episode:01JB5.../01JB5Z...", "episode:01JB5.../01JB6A..."]
  ---
  Before deploying `api/` to staging or production, run `make migrate`.

  Why: on 2026-09-12 a deploy without migrations crashed the service for 20 minutes, and it recurred in staging on 2026-09-30.
  Applies when: deploying anything under api/.
