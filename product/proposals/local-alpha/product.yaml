schema_version: 7.0.0
name: Kernle
release: local-alpha
outcome: >-
  A developer-operated agent preserves experiences across sessions, retrieves
  useful memory, and carries that memory between local installations without
  losing ownership or its evidence lineage.
boundary: >-
  A local, owner-only Python memory runtime with SQLite storage, one Entity and
  Stack API, MCP as its host interface, and a CLI for initialization, status, and
  diagnostics. The release supports raw evidence, deliberate promotion to
  episodes, get and text search, and one local export and restore workflow.
  Model-driven cognition, other memory types, additional hosts, remote storage,
  sharing, and hosted services are outside this release.

dcl:
  level: 3
  basis: >-
    A developer directly operates a limited local pilot and can retry or
    investigate visible failures. Persisted memory still requires strict
    ownership, provenance integrity, and atomic recovery.

actors:
  - id: ACTOR-OWNER
    name: Developer and stack owner
    goal: Operate and inspect a private memory stack and preserve it across sessions.
  - id: ACTOR-HOST
    name: Agent through the trusted local MCP host
    goal: Capture evidence, deliberately record episodes, and retrieve the owner's memory.

capabilities:
  - id: CAP-SETUP
    name: Initialize and inspect a local stack
    actor_ids: [ACTOR-OWNER]
    outcome: The owner can identify the selected stack, its local storage, and whether it can accept operations.
    acceptance:
      - Initialization establishes one owner-bound SQLite database for the selected stack.
      - Reopening the same stack preserves memory; a conflicting identity or storage path is refused.
      - Status distinguishes uninitialized, usable empty, usable populated, and unavailable storage.
      - Diagnostics identify an actionable failure without exposing memory to an unauthorized requester.

  - id: CAP-CAPTURE
    name: Capture evidence and promote an episode
    actor_ids: [ACTOR-OWNER, ACTOR-HOST]
    outcome: The owner can retain source evidence and deliberately create an episode that cites it.
    acceptance:
      - Successful raw capture returns a durable record identity and preserves the submitted content without silent truncation.
      - Promotion requires selected saved raw evidence and explicit episode content; direct ungrounded episode creation is unavailable.
      - The resulting episode retains its authenticated origin and links to the exact source records.
      - An invalid source, conflicting request, denied request, or storage failure leaves prior evidence intact and reports failure.
      - Capture and promotion work without a model, provider credential, or network connection.

  - id: CAP-RETRIEVE
    name: Get and search private memory
    actor_ids: [ACTOR-OWNER, ACTOR-HOST]
    outcome: The owner can find saved raw evidence and episodes and inspect their provenance.
    acceptance:
      - Get by identity and text search return only records in the authenticated owner's selected stack.
      - Results distinguish raw evidence from an episode interpretation and retain inspectable source references.
      - Empty search, unknown identity, invalid input, denied access, and storage failure have distinct structured outcomes.
      - Missing or forged identity returns no protected content, metadata, snippets, or counts.

  - id: CAP-PORTABILITY
    name: Export and restore a private stack
    actor_ids: [ACTOR-OWNER]
    outcome: The owner can inspect a local export and restore its memory and lineage into an empty local destination.
    acceptance:
      - One canonical export and restore format preserves the retained records, stack identity, origin, and lineage.
      - Export and restore preview are authorized operations; preview does not change memory.
      - Commit accepts the same owner and stack identity in an empty destination and reports durable completion.
      - Corrupt, unsupported, identity-conflicting, or incomplete artifacts leave the destination unchanged.
      - Restore does not merge into or overwrite a populated stack and cannot grant provenance-repair privileges.

exclusions:
  - Model-assisted or automatic promotion, provider adapters, and semantic-quality claims.
  - Notes, beliefs, values, goals, drives, relationships, playbooks, skills, narratives, epochs, and summaries as alpha memory types.
  - Pending memory, pondering, subconscious processing, trust networks, and advanced cognitive or psychological behavior.
  - OpenClaw and Claude Code host integrations, capture interception, and host-specific checkpoint workflows.
  - Web, mobile, dashboard, billing, and hosted cloud product surfaces.
  - Network remotes, sync, backend storage adapters, and cross-entity access or delegated sharing.
  - Ordinary in-place record edits, individual deletion or hard erasure, and public provenance-repair operations.
  - Restore merge, owner transfer, stack identity rebinding, and automatic conversion of unsupported legacy databases.
  - Separate checkpoint, dump, and general-purpose import workflows.
  - Performance guarantees without an identified workload or semantic retrieval quality guarantees.

success_measures:
  - The owner completes capture, explicit episode promotion, retrieval, and export/restore with no provider or network dependency.
  - An authorized round trip retains every exported record identity and evidence reference.
  - Unauthorized operations disclose no protected records or metadata and change no memory.
  - Failed writes, failed restore, and failed schema changes preserve the prior valid state.
