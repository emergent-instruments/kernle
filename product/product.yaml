schema_version: 7.0.0
name: Kernle
release: 1.0.0
outcome: >-
  AI agents that a person runs on their own machines stop repeating mistakes
  and start compounding skill. Kernle captures what happens in their sessions,
  works out what mattered, consolidates it while the agents are idle, and brings
  the right memory back at the right moment. It costs the working agent no
  memory upkeep, and every memory stays private, traceable to its source, and
  deletable.
boundary: >-
  A local memory service shipped as one Rust binary for macOS and Linux
  machines the owner controls, including always-on home servers and personal
  VPS hosts. It connects to Claude Code, Codex CLI, and OpenClaw on the same
  machine. Each machine holds its own memory. Included: automatic capture,
  computed appraisal ("emotion"), background consolidation into markdown
  memory cards and Agent Skills, cue-driven recall with pre-action gut checks,
  owner review and editing, retention, and real deletion. Excluded: memory
  sync between machines, shared or team memory, any hosted service, cloud-hosted
  agents, and agent persona or self-model memory.

dcl:
  level: 3
  basis: >-
    Developers install and operate Kernle on their own machines. Background
    consolidation may stop and resume, and the owner can see and correct its
    results. No hosted operation exists. Privacy, deletion, and fail-open
    protections apply in full regardless of this level.

actors:
  - id: ACTOR-001
    name: Owner
    goal: >-
      Have their agents remember what matters across sessions, while keeping
      full control over what is kept, seen, and deleted.
  - id: ACTOR-002
    name: Agent
    goal: >-
      Receive the memory relevant to the current work without spending effort
      on memory upkeep.

capabilities:
  - id: CAP-001
    name: Set up local memory and connect agent runtimes
    actor_ids: [ACTOR-001]
    outcome: The owner can install Kernle, connect each runtime, and see what is connected and where memory content may go.
    behavior_refs:
      - modules/spaces/experience/user-flows.md
  - id: CAP-002
    name: Capture experience without agent effort
    actor_ids: [ACTOR-001, ACTOR-002]
    outcome: Session activity becomes private, scrubbed experience records, and explicit requests to remember are honored.
    behavior_refs:
      - modules/capture/sequences/sequences.md
  - id: CAP-003
    name: Appraise what mattered
    actor_ids: [ACTOR-002]
    outcome: Each episode of work carries an explainable appraisal and functional emotion label that decide how it is remembered.
    behavior_refs:
      - modules/appraisal/behavior/rules.md
  - id: CAP-004
    name: Consolidate experience while idle
    actor_ids: [ACTOR-001, ACTOR-002]
    outcome: Background sleep turns what mattered into guardrails, lessons, preferences, facts, open loops, and skills, with a reviewable record of every change.
    behavior_refs:
      - modules/consolidation/sequences/sequences.md
      - modules/consolidation/experience/user-flows.md
  - id: CAP-005
    name: Recall the right memory at the right moment
    actor_ids: [ACTOR-002]
    outcome: The agent receives a small memory index at session start, relevant memories when a prompt matches them, and a gut check before risky actions.
    behavior_refs:
      - modules/recall/experience/user-flows.md
  - id: CAP-006
    name: Inspect and edit memory as files
    actor_ids: [ACTOR-001]
    outcome: The owner can read, edit, and pin any memory as a markdown file and see why it exists.
    behavior_refs:
      - modules/memory/experience/user-flows.md
  - id: CAP-007
    name: Forget
    actor_ids: [ACTOR-001, ACTOR-002]
    outcome: Unused memory expires on schedule, and the owner can delete any memory and its sources completely.
    behavior_refs:
      - modules/retention/experience/user-flows.md

exclusions:
  - Memory sync between machines, and project memory committed to repositories
  - Shared, team, or organization memory spaces
  - Hosted services, cloud-hosted agents, OpenTelemetry ingest, and CI or pull-request outcome webhooks
  - Agent persona and self-model memory (values, self-narrative, persona cards)
  - Learned appraisal weights and model fine-tuning from memory
  - Windows hosts
  - Import of Kernle 0.x memory stacks
  - Replacing, blocking, or rewriting a runtime's native memory files

success_measures:
  - >-
    On recurring task sequences, connected agents repeat a previously corrected
    or failed approach less often than the same agents using native memory alone.
  - >-
    Appraisal-weighted consolidation lowers the repeat-error rate compared with
    an otherwise identical recency-and-relevance configuration, without
    increasing unnecessary hesitation on safe actions.
  - >-
    The owner can trace any memory to the episodes that justify it and remove
    it, with its sources, completely.
